version: "3.8"

services:
  mcp-bridge:
    build: .
    container_name: mcp-bridge
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - ANTIGRAVITY_HOST=192.168.178.40
      - ANTIGRAVITY_PORT=3000
      - COMMAND_TIMEOUT=30000
      - MAX_FILE_SIZE=10485760
    volumes:
      # Mount a workspace directory for file operations (optional)
      # - /path/to/workspace:/workspace
      - mcp-data:/app/data
    networks:
      - mcp-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mcp-data:


networks:
  mcp-net:
    driver: bridge
